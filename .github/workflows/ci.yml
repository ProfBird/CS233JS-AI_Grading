name: CI

on:
  push:
    branches: [main]
  pull_request:

# Unit tests don't launch a browser, so skip Puppeteer's Chromium download
# to keep installs fast and avoid network flakiness in CI.
env:
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Run all three OSes even if one fails, so a Windows-only break is visible
      # alongside a passing Linux/macOS run.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # The python language adapter's tests need ruff/pytest; they're not part of any
      # npm dependency, so install them explicitly. GitHub-hosted runners already ship
      # a Python interpreter on all three OSes. C++/C# adapter tests self-skip
      # (beforeAll + ctx.skip()) if g++/dotnet aren't present on a given runner image,
      # so no install step is added for those — see DEVELOPER_GUIDE.md's CI section.
      - run: python -m pip install --disable-pip-version-check ruff pytest
      - run: npm test

  lint:
    # Correctness/syntax gate for the grader's own source. Lint results are
    # OS-independent, so this runs once rather than across the matrix.
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
