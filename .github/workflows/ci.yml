name: CI

on:
  push:
    branches: [main]
  pull_request:

# Unit tests don't launch a browser, so skip Puppeteer's Chromium download
# to keep installs fast and avoid network flakiness in CI.
env:
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Run all three OSes even if one fails, so a Windows-only break is visible
      # alongside a passing Linux/macOS run.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
